plugins { id 'com.android.application' }

// Remove legacy Kotlin JDK7/JDK8 split artifacts that conflict with the
// Kotlin stdlib bundled by current AndroidX/AppCompat dependencies.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android { namespace 'com.fastkeyboard'; compileSdk 35
    dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }

defaultConfig { applicationId 'com.fastkeyboard'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
}
